[project]
name = "admissions-bot"
version = "0.1.0"
description = "Telegram AI bot that summarizes admissions/scholarship links, PDFs and DOCX files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "youtube-transcript-api>=1.0",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
# Fallbacks, installed only when needed (see ARCHITECTURE.md "Стек и зависимости").
browser = ["playwright>=1.48"]
youtube-fallback = ["yt-dlp>=2024.10.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
    "RUF001", "RUF002", "RUF003",  # ambiguous-unicode checks flag all Cyrillic text
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["bot"]

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true  # lxml has no bundled stubs

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real external APIs (deselected by default)"]
addopts = "-m 'not live'"
